<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Register - SportsReplayed</title> 
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-form-container {
            max-width: 450px;
            margin: 50px auto;
            padding: 30px;
            background-color: var(--card-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .login-form-container h1 {
            text-align: center;
            border-bottom: none;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-light);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            border-radius: 5px;
            box-sizing: border-box; /* Важно для padding */
        }
        .form-group button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 5px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">Sports<span>Replayed</span></a>
            
            <nav class="main-nav">
                <a href="#">GAMES</a>
                <a href="#">LISTS</a>
                <a href="#">MEMBERS</a>
                <a href="#">DIARY</a>
            </nav>

            <input type="text" placeholder="Search games, players, lists..." style="width: 250px; padding: 8px; background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-light); border-radius: 5px;">

            <div class="user-actions">
                <a href="login.html">SIGN IN</a>
                <a href="register.html" class="btn-signup">CREATE ACCOUNT</a>
            </div>
        </div>
    </header>

    <main>
        <div class="login-form-container">
            <form>
                <h1>Sign In</h1>
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <button type="submit">Sign In</button>
                </div>
                <div class="form-footer">
                    <p>Don't have an account? <a href="register.html">Create one</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <a href="#">About</a> &middot;
            <a href="#">Terms of Use</a> &middot;
            <a href="#">Privacy Policy</a> &middot;
            <a href="#">Contact</a>
            <p style="margin-top: 15px; font-size: 0.9rem;">&copy; 2024 SportsReplayed. Concept inspired by communty on cycling twitter.</p>
        </div>
    </footer>

    </body>
</html>
